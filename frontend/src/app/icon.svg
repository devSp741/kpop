<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Radar Pulse Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-opacity="0.3" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#accent-grad)" stroke-width="10" stroke-opacity="0.6" />

  <!-- Radar Sweep Cone -->
  <path d="M256 256 L385 127 A180 180 0 0 0 256 76 Z" fill="url(#accent-grad)" opacity="0.2" />

  <!-- Center Glowing Badge -->
  <circle cx="256" cy="256" r="64" fill="url(#accent-grad)" filter="url(#glow)" />

  <!-- Center Music Symbol -->
  <path d="M276 216 v60.5 a24 24 0 1 1 -16 -22.7 V228 l-32 8 v48.5 a24 24 0 1 1 -16 -22.7 V216 l64 -16 z" fill="#FFFFFF" />
</svg>
